# Local Postgres with pgvector. Matches DATABASE_URL in .env.example.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: consta
      POSTGRES_PASSWORD: consta
      POSTGRES_DB: consta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
