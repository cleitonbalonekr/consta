# Local Postgres with pgvector and MinIO as object storage. Matches DATABASE_URL and S3_* in .env.example.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: consta
      POSTGRES_PASSWORD: consta
      POSTGRES_DB: consta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # MinIO stopped publishing its images on Docker Hub and quay.io; Bitnami's frozen copy is pinned here.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: consta
      MINIO_ROOT_PASSWORD: consta-secret
      # Created on start, so the app finds it.
      MINIO_DEFAULT_BUCKETS: consta
      # The browser PUTs parts straight to MinIO from the dev server (3000) and the E2E server (3100).
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:3100
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  minio-data:
